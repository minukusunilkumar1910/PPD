<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Periodic Proo</title>
    <link href="https://cdn.replit.com/agent/bootstrap-agent-dark-theme.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="shortcut icon" href="./icon.png" type="image/x-icon">
    <link href="/static/css/style.css" rel="stylesheet">
    <script src="https://unpkg.com/tone"></script>
</head>
<body>  
    <div class="container-fluid py-4">
        <div class="green">
            <div class="col-12 text-center mb-4">
                <h1>Periodic Proo</h1>
            </div>
        </div>

        <div class="row">
            <div class="col-md-2">
                <div class="player-area text-center">
                    <h4>Player 1</h4>
                    <div id="message1" class="player-message"></div>
                    <div class="dice-area" id="dice1">
                        <div class="dice">
                            <i class="fas fa-dice-six"></i>
                        </div>
                        <div class="mt-2">Click to roll</div>
                    </div>
                    <div class="position mt-3">Position: <span id="pos1">0</span></div>
                </div>
            </div>

            <div class="col-md-8">
                <div id="game-board" class="game-board"></div>
            </div>

            <div class="col-md-2">
                <div class="player-area text-center">
                    <h4>Player 2</h4>
                    <div id="message2" class="player-message"></div>
                    <div class="dice-area" id="dice2">
                        <div class="dice">
                            <i class="fas fa-dice-six"></i>
                        </div>
                        <div class="mt-2">Click to roll</div>
                    </div>
                    <div class="position mt-3">Position: <span id="pos2">0</span></div>
                </div>
            </div>
        </div>
    </div>
    <script src="/static/js/game.js"></script>
</body>
</html>
